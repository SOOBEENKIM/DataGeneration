diagnostics:
  aggregation: mean_nonfirst_histories_per_entity_then_mean_entities_per_context
  uncertainty: descriptive_entity_standard_error_not_model_seed_uncertainty
  arms: [F, M, R, Z]
  per_arm_metrics: [factual_repeat_BCE, factual_mark_NLL, full_support_copy_range, full_support_repeat_range]
  route_metrics: [mean_logit, absolute_mean_logit, train_weighted_residual_RMS]
  paired_loss_contrasts: [M_minus_F, M_minus_Z, R_minus_F, F_minus_Z]
  primary_explanation: U_kappa_0_rare_context_at_best_and_epoch_9
  controls: all_other_contexts_candidates_and_active_kappa_1_rare
directional_hypotheses:
  mean_useful_in_primary_null: M_minus_Z_repeat_BCE_negative_in_train_and_validation_both_checkpoints
  residual_harmful_in_primary_null: M_minus_F_repeat_BCE_negative_in_train_and_validation_both_checkpoints
  residual_useful_in_primary_active: M_minus_F_repeat_BCE_positive_in_train_and_validation_both_checkpoints
  no_significance_or_confirmatory_claim: true
mechanical_checks:
  reconstruction_max_absolute_error: 0.000001
  weighted_residual_mean_max_absolute_error: 0.00000001
  original_copy_and_repeat_probability_match_max_absolute_error: 0.000001
  historical_full_zero_BCE_match_max_absolute_error: 0.000001
  pairwise_repeat_BCE_and_mark_NLL_delta_match_max_absolute_error: 0.000001
