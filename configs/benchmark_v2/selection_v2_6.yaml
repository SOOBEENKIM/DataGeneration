schema_version: benchmark-v2.6-validation-selection-v1
mode: PREPARATION_ONLY
scenario: joint_semimarkov_v2b
kappa: 1.0
test_split_access: FORBIDDEN
v2_5_test_artifacts:
  permitted_use: forensic_cause_evidence_only
  candidate_selection_use: FORBIDDEN
model_order:
  - ctgan_separate_class
  - tvae_separate_class
  - neural_sequence
  - cof_seqgen
model_roles:
  primary_c2_learned:
    - ctgan_separate_class
    - tvae_separate_class
    - cof_seqgen
  secondary:
    - neural_sequence
  fixed_reference:
    - empirical_iid

selection_budget:
  candidates_per_model: 4
  evaluation_candidates_per_model: 4
  evaluation_candidates_all_models: 16
  training_trajectories_per_model: 3
  training_trajectories_all_models: 12
  selection_seeds: [2601]
  requested_updates_per_trajectory: 20000
  eligible_checkpoint_steps: [10000, 20000]
  checkpoint_interval_steps: 100
  max_gpu_wall_seconds_per_trajectory: 7200
  max_gpu_hours_per_trajectory: 2.0
  max_gpu_hours_per_model: 6.0
  max_gpu_hours_all_models: 24.0
  early_stopping: false
  partial_candidate_selection: FORBIDDEN
  result_based_budget_extension: FORBIDDEN
  candidate_training_execution_authorized: false

validation_gate:
  threshold_provenance:
    fit_split: train
    source_sha256: a241491deee47a4b0fc6dc22e561c8fbf304086ed04dd4dca1ace8440583b27b
    v2_5_threshold_mutation: false
  thresholds:
    amount_ks: 0.006081138155655141
    gap_ks: 0.006387882975686154
    amount_abs_standardized_label_effect: 0.0363693454591819
    gap_abs_standardized_label_effect: 0.051540527275560376
    receiver_max_abs_signed_frequency: 0.02
  metrics:
    - amount_ks
    - gap_ks
    - amount_abs_standardized_label_effect
    - gap_abs_standardized_label_effect
    - receiver_max_abs_signed_frequency
  selection_rule:
    eligibility: all_five_row_marginal_guards_PASS
    primary_objective: minimize_max_amount_ks_gap_ks
    secondary_objective: minimize_sum_amount_ks_gap_ks
    final_tiebreaker: lexicographic_candidate_id
    primary_no_pass_action: PROHIBIT_V2_6_PRIMARY_C2_FULL_RUN
    secondary_no_pass_action: RECORD_NOT_EVALUABLE_WITHOUT_BLOCKING_PRIMARY_C2

