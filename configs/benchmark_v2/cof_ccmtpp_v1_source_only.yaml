schema_version: cof-ccmtpp-v1-source-only-v1
mode: SOURCE_ONLY
family: cof_ccmtpp_v1
future_artifact_root: artifacts/cof_ccmtpp_v1
future_data_root: data/cof_ccmtpp_v1

safety:
  execution_authorized: false
  authorization_creation_authorized: false
  gpu_query_authorized: false
  cuda_authorized: false
  model_fit_authorized: false
  checkpoint_write_authorized: false
  model_sample_authorized: false
  evaluation_authorized: false
  selection_authorized: false
  internal_test_authorized: false
  sparkov_fraud_test_authorized: false
  tstr_authorized: false
  privacy_authorized: false
  full_run_authorized: false
  entity_id_input: FORBIDDEN
  validation_fit_rows: 0
  internal_test_fit_rows: 0
  fraud_test_fit_rows: 0

common_contract:
  sequence_label: Y
  conditioning: [Y, target_length]
  valid_mask: contiguous_prefix
  padding_masked_from_attention_and_loss: true
  amount_contract: frozen_non_v3_train_only_encode_inverse_decode_v1
  amount_architecture_redesign: false
  gap_representation: continuous_log1p
  gap_density: mixture_logistic
  gap_support_max_rule: train_observed_max_valid_gap
  gap_bin_classification: FORBIDDEN
  receiver_vocabulary_fit_split: train
  hierarchy_fit_split: train
  receiver_pad_code: 0
  receiver_unk_code: 1
  receiver_hierarchy_rule:
    algorithm: descending_frequency_then_code_round_robin_tail
    head_min_count: 32
    max_head_categories: 512
    tail_cluster_count: 64
  sampled_gap_receiver_conditioning: model_sample_only
  full_sequence_denoising_transformer_reuse: false
  structure_loss: null

model:
  seed: 4001
  d_model: 128
  n_heads: 4
  n_layers: 2
  max_length: 64
  dropout: 0.0
  gap_mixture_components: 5
  gap_max_seconds: train_state_bound
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 128
  requested_updates: 20000
  max_wall_seconds: 7200
  checkpoint_interval_updates: 1000
  early_stopping: FORBIDDEN
  update_sweep: FORBIDDEN

candidates:
  - candidate_id: C0
    model_id: frozen_non_v3_cof_control
    status: FROZEN_REFERENCE_ONLY
    implemented: false
    execute: false
    changes: []
  - candidate_id: C1
    model_id: cof_ccmtpp_v1_causal_continuous_flat
    status: IMPLEMENTED_SOURCE_ONLY
    implemented: true
    execute: false
    parent: C0
    changes: [causal_decoder, continuous_gap_density]
    receiver_path: flat_no_copy
    y_likelihood: ordinary
  - candidate_id: C2
    model_id: cof_ccmtpp_v1_sampled_gap_copy
    status: IMPLEMENTED_SOURCE_ONLY_GATED_ON_C1
    implemented: true
    execute: false
    parent: C1
    changes: [sampled_gap_receiver_conditioning, causal_copy_gate]
    receiver_path: flat_new_plus_pointer_copy
    y_likelihood: ordinary
  - candidate_id: C3
    model_id: cof_ccmtpp_v1_hierarchical_receiver
    status: IMPLEMENTED_SOURCE_ONLY_GATED_ON_C2
    implemented: true
    execute: false
    parent: C2
    changes: [train_only_head_tail_hierarchy]
    receiver_path: hierarchical_new_plus_pointer_copy
    y_likelihood: ordinary
  - candidate_id: C4
    model_id: cof_ccmtpp_v1_y_balanced
    status: IMPLEMENTED_SOURCE_ONLY_GATED_ON_C3
    implemented: true
    execute: false
    parent: C3
    changes: [y_balanced_conditional_likelihood]
    receiver_path: hierarchical_new_plus_pointer_copy
    y_likelihood: equal_class_mean

stop_criteria:
  C1:
    required_parent: C0
    all_datasets_and_classes_required: true
    gap_fidelity: current_gap_ks_le_parent
    coherence: current_short_gap_repeat_error_le_parent
  C2:
    required_parent: C1
    all_datasets_and_classes_required: true
    short_gap_repeat: current_strictly_less_parent
    receiver_tv: current_le_parent
  C3:
    required_parent: C2
    all_datasets_required: true
    full_receiver_tv: current_strictly_less_parent
    decomposition: head_tail_unk_each_le_parent_and_one_strictly_less
  C4:
    required_parent: C3
    all_datasets_required: true
    y1_composite: current_strictly_less_parent
    y0_composite_relative_tolerance: 0.05
    y0_zero_parent_rule: current_must_equal_zero

deferred_C5:
  status: LOCKED_UNIMPLEMENTED
  implementation_allowed_only_after: C4_PASS
  selected_loss: null
  mutually_exclusive_options:
    - class_conditional_gap_quantile_x_receiver_frequency_bin_pair_loss
    - class_conditional_short_gap_x_repeat_coherence_loss
  simultaneous_losses: FORBIDDEN

diagnostic_schema:
  gap: [nll, class_0_nll, class_1_nll, finite_density_count, sampled_min, sampled_max]
  receiver: [overall_nll, head_nll, tail_nll, unk_nll, repeat_nll, new_nll, head_count, tail_count, unk_count, repeat_count, new_count]
  amount: [normalized_mse, decode_contract_sha256]
  fidelity: [classwise_gap_ks, full_receiver_tv, head_receiver_tv, tail_receiver_tv, unk_rate_error, short_gap_repeat_error]
  runtime: [requested_updates, actual_updates, elapsed_seconds, peak_memory_bytes]

