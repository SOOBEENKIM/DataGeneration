h1:
  candidate_id: H1
  model_id: cof_hcmttpp_v2_h1_hurdle_rqs
  status: IMPLEMENTED_SOURCE_ONLY
  parent_reference: frozen_ccmtpp_v1_C1
  changed_factors: [gap_decoder]
  unchanged_factors:
    - causal_backbone
    - y_length_conditioning
    - valid_padding_mask
    - amount_path_and_loss
    - flat_receiver_path_and_loss
    - non_gap_likelihood_aggregation
    - optimizer
    - seed
    - updates
    - sampling_plan
  gap_decoder:
    zero_atom:
      distribution: bernoulli_hurdle
      target_rule: exact_gap_equals_zero
      epsilon_relabeling: FORBIDDEN
      fit_split: train
    positive:
      variable: u=log1p(gap)
      density: conditional_monotone_rational_quadratic_quantile_spline
      central_bins: 16
      probability_knot_grid: uniform_conditional_central_0_to_1
      minimum_height_fraction_per_bin: 0.00000625
      minimum_derivative: 0.001
      mixture_logistic: FORBIDDEN
      gap_bin_classifier: FORBIDDEN
      posthoc_transport: FORBIDDEN
    tail:
      fit_split: train
      fit_by_y_class: true
      min_strict_exceedances: 128
      requested_tail_fraction: 0.005
      threshold_rule: largest_unique_u_with_at_least_m_strict_exceedances
      m_rule: max_128_ceil_0.005_n_positive
      strict_exceedance: true
      baseline_tail_probability_rule: strict_exceedance_fraction_for_initialization_only
      fixed_class_tail_probability: FORBIDDEN
      conditional_tail_gate:
        formula: sigmoid_logit_p_tail_base_y_plus_r_tail_h_y
        conditioning: [causal_history, y]
        residual_weight_initialization: zero
        residual_bias_initialization: zero
        train_rows_only: true
      baseline_scale_rule: mean_strict_excess_in_u_space
      fixed_class_tail_scale: FORBIDDEN
      conditional_scale:
        family: exponential_unbounded
        log_formula: log_beta_h_y_equals_log_beta_base_y_plus_r_beta_h_y
        formula: beta_base_y_times_exp_r_beta_h_y
        conditioning: [causal_history, y]
        residual_domain: signed_real
        residual_weight_initialization: zero
        residual_bias_initialization: zero
        initial_beta_equals_beta_base_exactly: true
        beta_is_strictly_positive_for_finite_residual: true
        beta_can_be_below_baseline: true
        beta_can_be_above_baseline: true
        initialization_source: train_only_beta_base
        train_rows_only: true
        overflow_or_nonfinite: INVALID
        underflow_to_zero_or_nonpositive: INVALID
        clip_overflow_or_nonfinite: FORBIDDEN
        redraw_overflow_or_nonfinite: FORBIDDEN
      central_event_mass: 1_minus_conditional_pi_tail
      tail_event_mass: conditional_pi_tail
      cdf_continuity_at_threshold: REQUIRED
      cdf_total_mass: 1.0
      support: positive_unbounded
      hard_upper_clip: FORBIDDEN
      redraw_nonfinite: FORBIDDEN
      validation_fit_rows: 0
      internal_test_fit_rows: 0
      fraud_test_fit_rows: 0

