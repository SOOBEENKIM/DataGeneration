  v2_5_final_complete:
    path: artifacts/benchmark_v2_5/full/FINAL_COMPLETE.json
    sha256: e47d46b995cdaa8f564ccb4cca56eeda4e9a17dba43c1ed2ca8c1a954e657d8a
  v2_5_frozen_manifest:
    path: data/benchmark_v2_5/frozen/joint_semimarkov_v2b/kappa_1.00/data_manifest.json
