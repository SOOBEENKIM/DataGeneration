reference_alignment:
  seq2synth:
    repository: https://github.com/KiwanKwon/Seq2Synth.git
    inspected_revision: 8346a95d6d84876a9ddf9196eb62758082619bd9
    paper_version: arXiv:2607.15606v2
    reported_scopes:
      berka: {trajectories: 900, total_rows_all_tables: 45666}
      hm: {trajectories: 10000, total_rows_all_tables: 297879}
      citi_bike: {trajectories: 5793, event_rows: 559644}
    tabdit_repository: https://github.com/fabriziogaruti/TabDiT.git
    tabdit_inspected_revision: cbb2b9a4866b0071ed9150a552704db188c33d4b
    tabdit_reported_tau_max_berka: 50
    note: >-
      Seq2Synth and TabDiT do not publish the Berka test entity IDs or the H&M
      random sample seed in the inspected repositories. The deterministic SAF
      Berka 900 subset is entity-count aligned only and is explicitly forbidden
      from being labeled Seq2Synth-comparable. Citi Bike is schema aligned but
      has unconfirmed row identity. Exact comparison requires upstream IDs.

