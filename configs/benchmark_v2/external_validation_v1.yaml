access_contract:
  fit: train.npz_only
  generate_then_evaluate: validation.npz_only
  internal_test: fail_closed
  sparkov_fraud_test: fail_closed
  plan_dry_run: manifest_and_hash_only_no_npz_load

analysis:
  controlled_five_guard_thresholds_reused: false
  bootstrap:
    source_split: train
    cluster_unit: entity
    replicates: 1000
    order_statistic_rank: 951
    interpolation: none
    freeze_before_validation: true
  fidelity:
    amount: [amount_ks_y0, amount_ks_y1]
    gap: [gap_total_variation_y0, gap_total_variation_y1]
    receiver: [receiver_total_variation_y0, receiver_total_variation_y1]
  coherence:
    definition: short_gap_times_receiver_repeat_by_class
    metrics:
      - short_gap_receiver_repeat_error_y0
      - short_gap_receiver_repeat_error_y1
    short_gap_threshold_source: train_positive_gap_median
  selection:
    fidelity_weight: 0.5
    coherence_weight: 0.5
    all_fidelity_pass_required: false
    tie_break:
      - combined_score
      - fidelity_max_ratio
      - coherence_max_ratio
      - candidate_id_lexicographic
  row_shuffle_negative_control:
    execution_enabled: false
    design_only: true
    fit_and_orientation: train_only
    preserve: [Y, length, valid_mask, per_window_transformed_row_multiset]
    permute_together: [amount, gap, receiver]
    expected_effect: reduce_short_gap_receiver_repeat_coherence
  test_unlock:
    requires_separate_authorization: true
    all_models_terminal_and_selected: true
    hard_validity_required: true
    all_fidelity_pass_required: false
    validation_report_and_hash_index_required: true
    internal_test_and_sparkov_fraudTest_remain_locked: true

prohibited:
  - gpu_or_cuda_query_in_plan_or_dry_run
  - raw_csv_access
  - model_import_fit_checkpoint_or_sample_in_plan_or_dry_run
  - internal_test_npz_load
  - sparkov_fraud_test_access
  - controlled_five_guard_threshold_reuse
  - existing_bundle_or_controlled_artifact_mutation
