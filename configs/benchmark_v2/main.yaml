schema_version: benchmark_v2.0
name: temporal_coupling_suite_v2
scenarios: [markov_persistence_v2a, joint_semimarkov_v2b]
primary_model_challenge_scenario: joint_semimarkov_v2b
data:
  n_train: 31951
  n_test: 7989
  sequence_length: {min: 16, max: 32}
  fraud_rate: 0.05
  n_gap_bins: 16
  n_receiver_categories: 64
  padding_side: right
  window_width: 7.0
  soft_g_temperature: 1.0
coupling:
  kappas: [0.0, 0.3, 0.5, 0.7, 1.0]
  gap_regime:
    burst_stationary_probability: 0.30
    normal_gap_scale: 2.0
    burst_gap_scale: 0.5
    rho_nonfraud: 0.0
    rho_fraud_max: 0.90
  receiver:
    rho_nonfraud: 0.0
    rho_fraud_max: 0.90
    stationary_distribution: uniform
  joint_semimarkov:
    burst_stationary_probability: 0.30
    duration:
      family: discrete_lognormal
      burst_target_mean: 6.0
      normal_target_mean: 14.0
      sigma: 0.60
      max_duration: 128
    receiver_repeat_probability: {low: 0.05, high: 0.90}
    equilibrium_initialization: true
    shared_gap_receiver_state_for_fraud_at_kappa_1: true
  amount_log: {mean: 5.0, std: 1.0, dependence: iid_label_independent}
seeds: {base: 42, test_offset: 100000}
binning: {fit_split: train, shared_across_kappa: true, reference_kappa: 0.0}
evaluation:
  primary_bins: 8
  confirmatory_bins: 4
  descriptive_bins: 2
  negative_control_abs_dynamic_range_max: 0.005
  dynamic_range: {hard_min_c1_minus_c0: 0.01, target_c1_minus_c0: 0.02}
  minimum_bin_count: 25
  bootstrap_resamples: 2000
